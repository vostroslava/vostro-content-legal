<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vostro Content TikTok Callback</title>
    <style>
      body {
        max-width: 820px;
        margin: 48px auto;
        padding: 0 20px;
        color: #17181c;
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 { line-height: 1.2; }
      code, pre {
        background: #f4f5f7;
        border-radius: 6px;
        font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      pre {
        overflow: auto;
        padding: 14px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      button {
        border: 0;
        border-radius: 6px;
        background: #17181c;
        color: white;
        cursor: pointer;
        font: inherit;
        padding: 10px 14px;
      }
      a { color: #0f5bd8; }
    </style>
  </head>
  <body>
    <h1>TikTok authorization callback</h1>
    <p>This page receives the authorization response for the Vostro Content TikTok integration.</p>
    <h2>Authorization code</h2>
    <pre id="code">No code parameter found.</pre>
    <button id="copy" type="button">Copy code</button>
    <p><a href="../">Back to Vostro Content</a></p>
    <script>
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const error = params.get("error");
      const output = document.getElementById("code");
      const copy = document.getElementById("copy");

      if (code) {
        output.textContent = code;
      } else if (error) {
        output.textContent = "Error: " + error;
      }

      copy.addEventListener("click", async () => {
        await navigator.clipboard.writeText(output.textContent);
        copy.textContent = "Copied";
      });
    </script>
  </body>
</html>
